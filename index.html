<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trimly.ar | WebAR Sakal Tıraşı Rehberi & Akıllı Ayna</title>
  <meta name="description" content="MediaPipe 3D yüz takibi ve hassas siyah rehber çizgileriyle tarayıcı tabanlı profesyonel sakal tıraş asistanı." />
  <meta name="theme-color" content="#0A0B0E" />

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- MediaPipe CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="dark-theme">

  <!-- Sanal Banyo Işığı Overlay -->
  <div id="ringLightOverlay" class="ring-light-overlay hidden"></div>

  <!-- Ana Uygulama Konteyneri -->
  <div class="app-container">
    
    <!-- Minimal Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <i data-lucide="scissors"></i>
        </div>
        <span class="brand-name">Trimly<span class="brand-ext">.ar</span></span>
      </div>

      <!-- Live Face Scan Badge -->
      <div id="faceScanBadge" class="face-scan-badge">
        <span class="status-dot"></span>
        <span id="faceShapeText">Yüz Taranıyor...</span>
      </div>

      <!-- Header Actions -->
      <div class="header-actions">
        <!-- Renk Modu (Siyah / Altın) -->
        <button id="btnToggleColor" class="icon-btn active" title="Çizgi Rengi (Siyah / Altın)">
          <i data-lucide="palette"></i>
        </button>

        <!-- Ayna Modu -->
        <button id="btnToggleMirror" class="icon-btn active" title="Ayna Modu (Yatay Çevir)">
          <i data-lucide="flip-horizontal"></i>
        </button>

        <!-- Banyo Işığı -->
        <button id="btnToggleRingLight" class="icon-btn" title="Banyo Işığı">
          <i data-lucide="sun"></i>
        </button>
      </div>
    </header>

    <!-- Kamera & AR Viewport -->
    <main class="viewport-section">
      <div class="viewport-wrapper" id="viewportWrapper">
        <video id="webcamVideo" playsinline webkit-playsinline muted class="webcam-video"></video>
        <canvas id="arCanvas" class="ar-canvas"></canvas>

        <!-- Laser Scan Effect -->
        <div id="scanLaser" class="scan-laser">
          <div class="laser-line"></div>
        </div>

        <!-- Camera Start Prompt Card -->
        <div id="cameraStartOverlay" class="camera-start-overlay">
          <div class="start-card glass-panel">
            <div class="start-icon-wrapper">
              <i data-lucide="camera"></i>
            </div>
            <h2>AR Sakal Rehberiniz</h2>
            <p>Kameranızı açın, yüzünüze 3B oturan profesyonel tıraş rehber çizgilerini anında kullanın.</p>
            
            <button id="btnStartCamera" class="btn-primary">
              <i data-lucide="video"></i> Kamerayı Aç ve Taramayı Başlat
            </button>
            <button id="btnDemoMode" class="btn-secondary">
              <i data-lucide="play-circle"></i> Kamerasız Demoyu Dene
            </button>
          </div>
        </div>

        <!-- Floating Toast -->
        <div id="hudOverlay" class="hud-overlay hidden">
          <div id="smartTipToast" class="smart-tip-toast glass-panel">
            <span id="smartTipText">Kameraya düz bakın. Yüz taranıyor...</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Minimal Dock -->
    <footer id="controlDock" class="control-dock glass-panel">
      <!-- Sakal Stilleri Karousel -->
      <div class="style-carousel" id="styleCarousel">
        <!-- JS ile doldurulacak -->
      </div>

      <!-- Aksiyon Barı -->
      <div class="primary-actions-bar">
        <button id="btnToggleLock" class="main-action-btn lock-btn" title="Köpük Modu (Çizgiyi Kilitler)">
          <i data-lucide="lock"></i>
          <span id="lockBtnText">Köpük Modu (Kilitle)</span>
        </button>

        <button id="btnCaptureSnapshot" class="main-action-btn capture-btn" title="Fotoğraf Çek">
          <i data-lucide="camera"></i>
          <span>Fotoğraf Çek</span>
        </button>
      </div>
    </footer>

    <!-- Snapshot Modal -->
    <div id="snapshotModal" class="modal-backdrop hidden">
      <div class="modal-card glass-panel snapshot-card">
        <button id="btnCloseSnapshot" class="modal-close-btn">&times;</button>
        <h3><i data-lucide="image"></i> Tıraş Rehberi Fotoğrafınız</h3>
        <div class="snapshot-preview-container">
          <img id="snapshotImg" src="" alt="Trimly AR Snapshot" />
        </div>
        <div class="modal-footer row">
          <a id="btnDownloadSnapshot" class="btn-primary" download="trimly-shave-guide.png">
            <i data-lucide="download"></i> İndir
          </a>
          <button id="btnCloseSnapshotBtn" class="btn-secondary">Kapat</button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
